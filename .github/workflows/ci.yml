name: ci
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get install -y -qq libegl1 libxkbcommon0
      - run: uv sync --extra vision --extra win
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run python tools/codegraph.py check
      - run: uv run pytest
        env: { QT_QPA_PLATFORM: offscreen }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra vision --extra win
      - run: uv run pytest -m "not win"
        env: { QT_QPA_PLATFORM: offscreen }
